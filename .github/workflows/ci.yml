name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        version: "latest"
        
    - name: Set up Python
      run: uv python install 3.12
        
    - name: Install dependencies
      run: uv sync
      
    - name: Run linter
      run: make lint

    - name: Verify installable package and CLI
      run: make package-check
      
    - name: Run tests
      run: make test
      
    - name: Run offline evaluation
      env:
        AGENT_LLM_PROVIDER: gemini
        AGENT_LLM_MODE: replay
        AGENT_MODEL_SMALL: gemini-flash-lite-latest
        AGENT_MODEL_MAIN: gemini-flash-lite-latest
      run: |
        cp eval/results/metrics.json /tmp/metrics_committed.json
        make eval

    - name: Check metrics drift
      run: |
        jq -S 'del(._metadata.timestamp, ._metadata.git_sha)' /tmp/metrics_committed.json > /tmp/old.json
        jq -S 'del(._metadata.timestamp, ._metadata.git_sha)' eval/results/metrics.json > /tmp/new.json
        diff -u /tmp/old.json /tmp/new.json > eval/results/drift_diff.txt || (cat eval/results/drift_diff.txt && exit 1)

    - name: Build submission artifact
      run: make dist
      if: always()

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: eval-results
        path: |
          eval/results/
          wajo-submission.zip
