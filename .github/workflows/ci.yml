name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        version: "0.4.x"
        
    - name: Set up Python
      run: uv python install 3.12
        
    - name: Install dependencies
      run: uv sync
      
    - name: Run linter
      run: make lint
      
    - name: Run tests
      run: make test
      
    - name: Run offline evaluation
      run: make eval
