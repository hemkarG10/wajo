name: Eval

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v2
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run setup and eval
        run: |
          make setup
          make eval
        env:
          AGENT_LLM_PROVIDER: heuristic
