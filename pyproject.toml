[project]
name = "agent"
version = "2.0.0"
description = "Calibrated-Autonomy Email Agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.4.0",
    "google-genai>=2.22.0",
    "matplotlib>=3.11.1",
    "openai>=1.30.0",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "scipy>=1.18.1",
    "typer>=0.27.2",
]

[project.scripts]
agent = "agent.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "hypothesis>=6.167.1",
    "import-linter>=2.15",
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]

[tool.ruff]
exclude = ["patches/", "scripts/", ".venv/"]

[tool.ruff.lint]
ignore = [
    "BLE001",   # blind except — intentional in LLM provider wrappers
    "SIM115",   # open without context manager — acceptable in scripts/tests
    "SIM102",   # collapsible-if — readability preference
    "PLW1510",  # subprocess.run without check — we handle returncode manually
    "F841",     # unused variable — some are kept for clarity
    "RUF059",   # unused unpacked variable
    "DTZ005",   # datetime.now without tz — only in heuristic test helper
    "PIE810",   # multiple startswith — readability preference
    "UP047",    # non-PEP695 generic — not yet migrating
    "FURB162",  # fromisoformat replace Z — backwards compat
    "FURB192",  # sorted vs min — readability preference
    "B023",     # function uses loop variable — intentional in validator
    "PERF102",  # dict iterator — negligible perf impact
    "S112",     # try-except-continue — intentional
]
