[project]
name = "agent"
version = "0.1.0"
description = "Calibrated-Autonomy Email Agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
]

[project.scripts]
agent = "agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "hypothesis>=6.167.1",
    "import-linter>=2.15",
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]
