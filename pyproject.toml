[project]
name = "agent"
version = "2.0.0"
description = "Calibrated-Autonomy Email Agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.4.0",
    "google-genai>=2.22.0",
    "matplotlib>=3.11.1",
    "openai>=1.30.0",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "scipy>=1.18.1",
    "typer>=0.27.2",
]

[project.scripts]
agent = "agent.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "hypothesis>=6.167.1",
    "import-linter>=2.15",
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]
